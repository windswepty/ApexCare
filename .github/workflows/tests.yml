# 안전 규칙 테스트를 우분투에서 돌린다.
# tests/fakewin.py 가 winreg·전원 API·sc.exe·APPDATA 를 가짜로 바꾸므로 Windows 가 필요 없고,
# 실제 시스템을 바꾸는 호출은 부르는 즉시 예외가 난다.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.13 은 설치 파일에 들어가는 버전, 3.12 는 os.path.isjunction 이 생긴 최소 버전
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 의존성 설치
        run: python -m pip install -r requirements-dev.txt

      - name: pytest (가짜 Windows)
        run: python -m pytest tests -ra
